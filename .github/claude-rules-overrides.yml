# Opt-out, role, and domain overrides for Claude rules distribution.
#
# By default, ALL repos in the NXD-Solutions org receive:
#   - All static Claude rules from static-claude-rules/
#   - decision-log-extract.md generated from the Developer role AI summaries
#
# Use this file to override or exclude specific repos, or to subscribe a repo
# to a domain's practitioner content — nxd-practices/practitioner/<slug>/ in
# NXD-Solutions/dna, shipped only to repos that list the domain here:
#
# overrides:
#   NXD-Solutions/some-design-repo:
#     role: Designer          # use a different role for decision-log-extract.md
#   NXD-Solutions/config-repo:
#     exclude: true           # skip this repo entirely
#   NXD-Solutions/data-dictionary:
#     domains:
#       - information          # domain slug — matches domains/<slug>.md in dna

overrides:
  NXD-Solutions/.github:
    exclude: true  # source repo — manages its own .claude/ manually
  NXD-Solutions/roadmap:
    exclude: true
  NXD-Solutions/studies:
    exclude: true  # holds only issues (the study library); receives no DNA, by the principal's decision
  NXD-Solutions/data-dictionary:
    domains:
      - information
      - enterprise-architecture
  NXD-Solutions/ai-prompting:
    domains:
      - ai-prompting
      - enterprise-architecture
  NXD-Solutions/Manager-Assistant-Plan:
    domains:
      - project-planning
  NXD-Solutions/Manager-Assistant-v2:
    domains:
      - enterprise-architecture
  NXD-Solutions/UX-Framework:
    domains:
      - enterprise-architecture
  NXD-Solutions/dna:
    domains:
      - enterprise-architecture
  NXD-Solutions/packages:
    domains:
      - enterprise-architecture
  NXD-Solutions/platform-config:
    domains:
      - enterprise-architecture
