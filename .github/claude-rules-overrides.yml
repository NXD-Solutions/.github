# Opt-out, role, and domain overrides for Claude rules distribution.
#
# By default, ALL repos in the NXD-Solutions org receive:
#   - All static Claude rules from static-claude-rules/
#   - decision-log-extract.md generated from the Developer role AI summaries
#
# Use this file to override or exclude specific repos, or to subscribe a repo
# to a domain's practitioner content — nxd-practices/practitioner/<slug>/ in
# NXD-Solutions/dna, shipped only to repos that list the domain here:
#
# A repo's relation to each domain (NXD-Solutions/dna#1391), an ordering where each level contains the
# one before: nothing < knows of < consumes < builds.
#   builds:   the domain's contract and its practitioner content (`domains:` is the older name for it)
#   consumes: the domain's contract
#   neither:  the domain's name and one line, in domains.md, which every repo receives
# A repo declaring neither key keeps every domain body until it declares one. The domains in
# universal-domains below reach every repo whatever it declares.
#
# overrides:
#   NXD-Solutions/some-design-repo:
#     role: Designer          # use a different role for decision-log-extract.md
#   NXD-Solutions/config-repo:
#     exclude: true           # skip this repo entirely
#   NXD-Solutions/data-dictionary:
#     domains:
#       - information          # domain slug — matches domains/<slug>.md in dna
#   NXD-Solutions/some-repo:
#     standards-exemption: "<reason, who granted it, date>"  # holds code without the dev
#       # standards, by the principal's grant; without a reason it exempts nothing (dna#1387)

universal-domains:  # consumed by every repo by nature (Peter, 2026-10-18; dna#1391)
  - framework
  - test
  - library
  - project-planning
  - dna

overrides:
  NXD-Solutions/.github:
    exclude: true  # source repo — manages its own .claude/ manually
    standards-exemption: "never hosts a session (Peter, 2026-10-18)"
  NXD-Solutions/roadmap:
    exclude: true
  NXD-Solutions/studies:
    exclude: true  # holds only issues (the study library); receives no DNA, by the principal's decision
  NXD-Solutions/Manager-Assistant-v2:
    builds:
      - application-development
      - deployment
      - runtime-operations
    consumes:
      - enterprise-architecture
      - ai-prompting
      - information
      - experience
      - security
      - compliance
      - procurement
  NXD-Solutions/packages:
    builds:
      - security
      - ai-prompting
      - runtime-operations
    consumes:
      - enterprise-architecture
      - information
      - compliance
      - deployment
      - procurement
      - experience
  NXD-Solutions/UX-Framework:
    builds:
      - experience
    consumes:
      - enterprise-architecture
      - procurement
      - security
  NXD-Solutions/data-dictionary:
    builds:
      - information
    consumes:
      - enterprise-architecture
      - compliance
      - security
  NXD-Solutions/ai-prompting:
    builds:
      - ai-prompting
    consumes:
      - enterprise-architecture
      - compliance
      - procurement
      - security
  NXD-Solutions/platform-config:
    builds: []
    consumes:
      - enterprise-architecture
      - deployment
      - runtime-operations
      - compliance
      - security
  NXD-Solutions/Manager-Assistant-Plan:
    builds:
      - project-planning
    consumes: []
  NXD-Solutions/dna:
    builds:
      - enterprise-architecture
    consumes: []
