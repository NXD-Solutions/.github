name: Test

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'verification/**'
      - 'distributed/**'
      # Its own file: without this, a change to the runtime these tests run on
      # -- or to the trigger itself -- merges unexercised.
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, not left to the runner default: an unpinned runtime states no
      # band at all, which is the one thing the admission record does not admit.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # The sync's Scopes: block is read by the DNA's own parser (NXD-Solutions/.github#402), so the tests
      # read it from a checkout of the DNA: one parser, never a copy.
      - uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/dna
          token: ${{ secrets.REPOS_PAT }}
          path: dna-repo
          sparse-checkout: |
            dna/scripts/confluence-tools
            dna/scripts/lib
      - run: npm ci
      - run: node --test verification/*.test.mjs
        env:
          DNA_REPO: ${{ github.workspace }}/dna-repo
