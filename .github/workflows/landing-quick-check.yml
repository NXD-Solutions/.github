name: Landing Quick Check

# The early warning: runs the repository's quick set on a landing branch after each merge into it and sets one commit status, `landing-quick`, on that commit (NXD-Solutions/.github#418,
# #423). It never sets `landing-gate`: that is the full test's alone, on the commit it tested (`landing-gate-check.yml`), so a candidate is never admitted on a quick pass.
# The quick set is the repository's: its command is the repository variable LANDING_QUICK_COMMAND (a shell command run from the checked-out branch), and the Node version it needs is
# LANDING_GATE_NODE (default 24). A repository that sets no quick command gets no `landing-quick` status and no run: the quick set is optional.
# The cost of a run is the gate's duration, billed per job with a one-minute minimum (NXD-Solutions/dna `github-actions.md`); it waits on Deployment's and the principal's acceptance, and
# a repository pays only once it carries the caller.
on:
  workflow_call:
    inputs:
      # Where the status script is read from. The distributed caller never passes it, so every repo reads `main`; a test run on a scratch repository names a branch of this
      # repo, to run the job before it is merged.
      script_ref:
        type: string
        default: main

permissions:
  contents: read
  packages: read
  statuses: write

# gh sends no usage data (NXD-Solutions/dna:nxd-practices/appendix/technology-admission/gh/gh-2.99.md).
env:
  GH_TELEMETRY: "false"

# One quick run per branch, the latest merge's: a merge that lands while an earlier run is going cancels it, so the head's status is the head's own and a commit that is no
# longer the head gets none. By design: the head's run covers the earlier commit's content, so "after each merge" is met by the run of the latest one, and a merge that
# gets no status was superseded, not missed.
concurrency:
  # A group of its own, `landing-quick-`: it never shares one with the full test, so a merge cancels only an earlier quick run and never a full test.
  group: landing-quick-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Landing quick
    # No quick command, no job: nothing is billed and no status is set.
    if: ${{ vars.LANDING_QUICK_COMMAND != '' }}
    runs-on: ubuntu-latest
    # The gate is the repository's, so its length is too; the bound is the platform's ceiling for a hung run, not a budget.
    timeout-minutes: 60
    steps:
      - name: Checkout the branch at the commit that was pushed
        uses: actions/checkout@v5
        with:
          # Full history: a gate that compares against its base (`origin/main`) needs it; at depth 1 the base does not resolve and such a gate skips its comparison and passes
          # (MADT-1's read of .github#420, F2).
          fetch-depth: 0

      - name: Checkout .github (for the status script)
        uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/.github
          ref: ${{ inputs.script_ref }}
          path: .github-landing-gate
          sparse-checkout: |
            scripts/landing-gate.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.LANDING_GATE_NODE || '24' }}
          # The same registry line the repos' own workflows use, so a gate that installs `@nxd-solutions` packages from their lockfiles reads the token from NODE_AUTH_TOKEN
          # (MADT-1's read of .github#420, F1). A repo that installs none is unaffected.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nxd-solutions'

      - name: Run the repository's quick set
        id: gate
        # A hung gate ends here, as a failed step, and the status step below reports it (a failure with no exit): the job's own limit never fires first. Were the job to
        # time out, the run is cancelled and no status is set (ai-prompting's read of .github#420, note 4).
        timeout-minutes: 55
        env:
          GATE_COMMAND: ${{ vars.LANDING_QUICK_COMMAND }}
          # The registry read token: the repository's secret NODE_AUTH_TOKEN when it set one (the name Manager-Assistant-v2's pipeline already uses, for packages the workflow's own
          # token cannot read, from another repository), else the workflow's token with `packages: read`. The gate is the repository's own code on a branch it merged under review,
          # so it holds this token as the repository's other workflows do. A gate that needs any other secret is out of scope here: this workflow names no other secret.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        # The step always succeeds: the gate's exit is an output, so the status step below reports it whatever it was. A missing command is its own output, never a pass.
        run: |
          set +e
          if [ -z "$GATE_COMMAND" ]; then
            echo "code=no-gate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash -o pipefail -c "$GATE_COMMAND" 2>&1 | tee "$RUNNER_TEMP/gate-output.txt"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set the landing-quick status on this commit
        # Runs whatever the gate did, so a failing gate is a red status and never a missing one; the job itself goes red when the status is not a pass. Not `always()`: that also
        # runs when a later merge cancels this run (observed on the scratch repository: the superseded commit got a failure status), and a cancel is no failure and that commit no longer the head.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: landing-quick
          TESTED_SHA: ${{ github.sha }}
          GATE_EXIT_CODE: ${{ steps.gate.outputs.code }}
          GATE_OUTPUT_FILE: ${{ runner.temp }}/gate-output.txt
        run: node .github-landing-gate/scripts/landing-gate.mjs
