name: Set Landed Check

# Sets the card of each issue a pull request closes to Landed on every project the card is on, when the pull request is merged into a landing branch (`landed/<name>`) (NXD-Solutions/dna#2004).
# The logic is `scripts/set-landed.mjs` (tested in `verification/set-landed.test.mjs`); the caller is `distributed/set-landed.yml`, copied byte for byte into every repo with a landing branch.
# No project is named: a card on a project with no Landed status (Critical, Priority) is left as it is, and the run says so.
# The token that writes the organisation's projects is a secret the caller passes: PROJECTS_PAT, else the existing ADD_TO_PROJECT_PAT. Which, and where it is placed, is the principal's
# decision (NXD-Solutions/dna#2004); a run with neither fails and says so.
on:
  workflow_call:
    inputs:
      # Where the script is read from. The distributed caller never passes it, so every repo reads `main`; a test run on a scratch repository names a branch of this repo.
      script_ref:
        type: string
        default: main

# The job reads the pull request's event; the only write is the project card, made with the token, so the workflow's own token needs no more than a read.
permissions:
  contents: read

env:
  GH_TELEMETRY: "false"

jobs:
  set-landed:
    name: Set Landed
    # The script checks the merge and the base itself, so the caller's filter and this condition are a second guard, not the only one.
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout .github (for the script)
        uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/.github
          ref: ${{ inputs.script_ref }}
          path: .github-set-landed
          sparse-checkout: |
            scripts/set-landed.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Move the cards to Landed
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT || secrets.ADD_TO_PROJECT_PAT }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          # The body goes through the environment, never into the command line: it is text anyone with write access to the pull request can set.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPO: ${{ github.repository }}
        run: node .github-set-landed/scripts/set-landed.mjs
