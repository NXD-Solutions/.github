name: Version Impact Check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require a Version Impact line for every touched @nxd-solutions/* package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const prNumber = process.env.PR_NUMBER;
          const repo = process.env.REPO;

          const files = JSON.parse(
            execSync(`gh pr view ${prNumber} --repo ${repo} --json files --jq '[.files[].path]'`, { encoding: 'utf8' })
          );

          const path = require('path');

          // packages/ shapes are not uniform (framework-standards.md: one-level
          // is the default, e.g. packages/platform/package.json; two-level is
          // grandfathered where grounded, e.g. packages/security/oauth-client/).
          // Walk up from each touched file to the nearest ancestor carrying a
          // package.json, rather than assume a fixed segment depth.
          function findPackageRoot(filePath) {
            let dir = path.posix.dirname(filePath);
            while (dir.startsWith('packages') && dir !== '.') {
              const pkgJsonPath = path.posix.join(dir, 'package.json');
              if (fs.existsSync(pkgJsonPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8'));
                return pkg.name && pkg.name.startsWith('@nxd-solutions/') ? dir : null;
              }
              const parent = path.posix.dirname(dir);
              if (parent === dir) break;
              dir = parent;
            }
            return null;
          }

          const touched = new Set();
          for (const f of files) {
            if (!f.startsWith('packages/')) continue;
            const pkgPath = findPackageRoot(f);
            if (pkgPath) touched.add(pkgPath);
          }

          if (touched.size === 0) {
            console.log('No @nxd-solutions/* packages touched -- check does not apply.');
            process.exit(0);
          }

          const body = execSync(`gh pr view ${prNumber} --repo ${repo} --json body --jq '.body // \"\"'`, { encoding: 'utf8' });
          const lineRe = /^Version Impact: (.+?): (Major|Minor|Patch) — .+$/;
          const levelRank = { Patch: 1, Minor: 2, Major: 3 };

          const declared = {};
          let maxLevel = null;
          for (const line of body.split('\n')) {
            const m = line.match(lineRe);
            if (!m) continue;
            declared[m[1]] = m[2];
            if (!maxLevel || levelRank[m[2]] > levelRank[maxLevel]) maxLevel = m[2];
          }

          const missing = [...touched].filter((pkg) => !declared[pkg]);
          if (missing.length > 0) {
            console.error('Missing "Version Impact:" line for: ' + missing.join(', '));
            console.error('Add one line per touched package to the PR body:');
            console.error('Version Impact: <package-path>: Major|Minor|Patch — <one-sentence reason>');
            process.exit(1);
          }

          const labelName = `semver:${maxLevel.toLowerCase()}`;
          try {
            execSync(`gh label create "${labelName}" --repo ${repo} --color ededed`, { stdio: 'ignore' });
          } catch (e) {
            // already exists -- fine
          }
          execSync(`gh pr edit ${prNumber} --repo ${repo} --add-label "${labelName}"`);
          console.log(`All touched packages declared. Applied label: ${labelName}`);
          NODE
