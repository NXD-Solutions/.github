name: Version Impact Check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    # Drafts do not run CI. The `github` context inside a reusable workflow is the
    # caller's, so this reads the caller's PR — the same inheritance `PR_NUMBER`
    # below already relies on. Job level, never step level: billing is per job at a
    # one-minute minimum, so a step-level guard pays in full and saves nothing.
    # The caller still owns *when* this runs: a reusable workflow's only trigger is
    # `workflow_call`, so each caller must carry `ready_for_review` in its own
    # `types:` or a PR marked ready without a further push never reaches this job.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v5

      # package.json reads in the check script resolve against this checkout
      # (the caller's own files); the check script itself lives here, in
      # .github, so it needs its own checkout to be present on disk.
      - name: Checkout .github (for the check script)
        uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/.github
          ref: main
          path: .github-shared
          sparse-checkout: |
            scripts/version-impact-check.mjs
          sparse-checkout-cone-mode: false

      - name: Require a Version Impact line for every touched @nxd-solutions/* package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node .github-shared/scripts/version-impact-check.mjs
