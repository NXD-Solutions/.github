name: Distribute Claude Config

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (org/repo) — leave empty to sync all repos'
        required: false
        type: string
      verbose:
        description: 'Verbose output — set to false for minimal diagnostic output (header, errors, and PR URLs only)'
        required: false
        type: boolean
        default: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preflight
        run: |
          echo "## Distribute Claude Config" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.verbose }}" != "false" ]]; then
            {
              echo ""
              echo "**Purpose**: Distribute DNA rules and commands from \`NXD-Solutions/dna\` to all subscribing repos."
              echo ""
              echo "**Process**:"
              echo "- *Preflight* — GitHub validates the workflow and prepares runners"
              echo "- *Load subscribers* — discovers all org repos, applies overrides, builds the sync matrix"
              echo "- *Sync* — runs in parallel per repo: updates decision-log extract, copies DNA rules/commands to \`.claude/rules/dna/\` and \`.claude/commands/dna/\`, copies on-demand appendix to \`.claude/dna/appendix/\`, removes old distribution paths, opens a PR if anything changed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Preflight passed." >> "$GITHUB_STEP_SUMMARY"

  load-subscribers:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Discover repos and apply overrides
        id: build
        env:
          GH_TOKEN: ${{ secrets.REPOS_PAT }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          output=$(python3 -c "
          import yaml, json, subprocess, os

          with open('.github/claude-rules-overrides.yml') as f:
            config = yaml.safe_load(f) or {}
          overrides = config.get('overrides') or {}

          target = os.environ.get('TARGET_REPO', '').strip()

          if target:
            override = overrides.get(target, {})
            role = override.get('role', 'Developer')
            include = [{'repo': target, 'role': role}]
            print(json.dumps({'matrix': {'include': include}, 'total': 1, 'excluded': 0, 'targeted': True}))
          else:
            result = subprocess.run(
              ['gh', 'api', 'orgs/NXD-Solutions/repos', '--paginate', '--jq', '.[].full_name'],
              capture_output=True, text=True
            )
            repos = [r.strip() for r in result.stdout.strip().splitlines() if r.strip()]

            include = []
            excluded = 0
            for repo in repos:
              override = overrides.get(repo, {})
              if override.get('exclude'):
                excluded += 1
                continue
              role = override.get('role', 'Developer')
              include.append({'repo': repo, 'role': role})

            print(json.dumps({'matrix': {'include': include}, 'total': len(repos), 'excluded': excluded, 'targeted': False}))
          ")
          matrix=$(echo "$output" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d['matrix']))")
          total=$(echo "$output" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total'])")
          excluded=$(echo "$output" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['excluded'])")
          targeted=$(echo "$output" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['targeted'])")
          subscribers=$((total - excluded))
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$targeted" = "True" ]; then
            echo "**Target:** \`${{ inputs.repo }}\` (single-repo run)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Subscribers:** $subscribers repos queued for sync ($excluded excluded by overrides — see \`.github/claude-rules-overrides.yml\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: load-subscribers
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.load-subscribers.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout NXD-Solutions/.github (scripts and registry)
        uses: actions/checkout@v5

      - name: Checkout NXD-Solutions/dna (DNA source)
        uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/dna
          token: ${{ secrets.REPOS_PAT }}
          path: dna-repo

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # An empty subscriber has no `refs/heads/main` for the checkout below to
      # find, and git reports that as `fatal: couldn't find remote ref
      # refs/heads/main` + exit 128 — the symptom, not the cause. Onboarding a
      # new repo is exactly when a subscriber is empty, so the dead end sits on
      # the onboarding path. Name the cause and the command that fixes it
      # (*Validate preconditions before proceeding*: a failure surfaces to
      # whoever can resolve it, with enough context to self-serve the fix).
      - name: Preflight — the subscriber must be initialised
        env:
          GH_TOKEN: ${{ secrets.REPOS_PAT }}
        run: |
          if ! gh api "repos/${{ matrix.repo }}/commits?per_page=1" >/dev/null 2>&1; then
            echo "::error title=Subscriber not initialised::${{ matrix.repo }} has no commits, so refs/heads/main does not exist and the checkout cannot succeed. Run /dna:bootstrap create <repo-name> to scaffold and make the first commit, then re-run this workflow."
            exit 1
          fi

      - name: Checkout subscriber repo
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.REPOS_PAT }}
          path: subscriber

      - name: Run sync script
        working-directory: subscriber
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: $GITHUB_WORKSPACE/node_modules/.bin/tsx $GITHUB_WORKSPACE/scripts/sync-decisions.ts --role ${{ matrix.role }}

      - name: Remove old DNA distribution paths from subscriber
        run: |
          # Rules: remove fully-distributed subdirectories from old locations
          for dir in thinking-core nxd-practices governance claude-code dev figma github confluence; do
            rm -rf "subscriber/.claude/rules/$dir"
          done
          # Rules/configuration: remove only previously-distributed files (preserve local files)
          while IFS= read -r -d '' f; do
            relative="${f#$GITHUB_WORKSPACE/dna-repo/dna/rules/configuration/}"
            rm -f "subscriber/.claude/rules/configuration/${relative}"
          done < <(find $GITHUB_WORKSPACE/dna-repo/dna/rules/configuration -type f -print0 2>/dev/null || true)
          rmdir subscriber/.claude/commands/dev/ 2>/dev/null || true
          # Remove CLAUDE.md and README.md � not for distribution
          find subscriber/.claude/rules/dna -name "CLAUDE.md" -delete 2>/dev/null || true
          find subscriber/.claude/rules/dna -name "README.md" -delete 2>/dev/null || true
          find subscriber/.claude/commands/dna -name "CLAUDE.md" -delete 2>/dev/null || true
          find subscriber/.claude/commands/dna -name "README.md" -delete 2>/dev/null || true
          # Remove .governance/ directories - not for distribution
          find subscriber/.claude/rules/dna -type d -name ".governance" -exec rm -rf {} + 2>/dev/null || true
          find subscriber/.claude/commands/dna -type d -name ".governance" -exec rm -rf {} + 2>/dev/null || true

      - name: Prepare rsync exclude list
        run: |
          # Single home for the distribution levers (dna claude-rules-system.md: dot + name).
          # One definition, sourced by every copy via --exclude-from — no per-step drift.
          printf '%s\n' '.*' 'CLAUDE.md' 'README.md' 'meta.md' '*.meta.md' > "$RUNNER_TEMP/rsync-excludes.txt"

      - name: Copy DNA rules to subscriber
        run: |
          mkdir -p subscriber/.claude/rules/dna/
          rsync -a --delete --exclude-from="$RUNNER_TEMP/rsync-excludes.txt" $GITHUB_WORKSPACE/dna-repo/dna/rules/. subscriber/.claude/rules/dna/

      - name: Copy NXD-practices rules to subscriber
        run: |
          # NXD instance layer — sibling product to the DNA; auto-loaded like the DNA rules.
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/nxd-practices/rules/*" > /dev/null 2>&1; then
            mkdir -p subscriber/.claude/rules/nxd-practices/
            rsync -a --delete --exclude-from="$RUNNER_TEMP/rsync-excludes.txt" $GITHUB_WORKSPACE/dna-repo/nxd-practices/rules/. subscriber/.claude/rules/nxd-practices/
          fi

      - name: Copy DNA commands to subscriber
        run: |
          mkdir -p subscriber/.claude/commands/dna/
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/dna/commands/*" > /dev/null 2>&1; then
            rsync -a --delete --exclude-from="$RUNNER_TEMP/rsync-excludes.txt" $GITHUB_WORKSPACE/dna-repo/dna/commands/. subscriber/.claude/commands/dna/
          fi

      - name: Copy DNA scripts to subscriber
        run: |
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/dna/scripts/*" > /dev/null 2>&1; then
            mkdir -p subscriber/.claude/scripts/
            rsync -a --exclude=".*" $GITHUB_WORKSPACE/dna-repo/dna/scripts/. subscriber/.claude/scripts/
          fi

      - name: Copy DNA appendix to subscriber
        run: |
          # On-demand reference content — distributed OUTSIDE .claude/rules/ so it is not auto-loaded.
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/dna/appendix/*" > /dev/null 2>&1; then
            mkdir -p subscriber/.claude/dna/appendix/
            rsync -a --delete --exclude-from="$RUNNER_TEMP/rsync-excludes.txt" $GITHUB_WORKSPACE/dna-repo/dna/appendix/. subscriber/.claude/dna/appendix/
          fi

      - name: Guard — appendix must distribute when the source has it
        run: |
          # Hard block against the highest-impact failure mode: if dna/appendix/ has content
          # but nothing landed in .claude/dna/appendix/ (copy step removed or broken), refuse
          # to proceed — otherwise a shrunk rule ships with its operations spec silently dropped.
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/dna/appendix/*" > /dev/null 2>&1; then
            if [ -z "$(find subscriber/.claude/dna/appendix -type f 2>/dev/null)" ]; then
              echo "::error::dna/appendix/ has content but .claude/dna/appendix/ is empty after copy — appendix distribution is broken. Refusing to ship (would silently drop on-demand operational specs)."
              exit 1
            fi
          fi

      - name: Copy NXD-practices appendix to subscriber
        run: |
          # On-demand reference for the NXD layer — outside .claude/rules/ so it is not auto-loaded.
          if compgen -G "$GITHUB_WORKSPACE/dna-repo/nxd-practices/appendix/*" > /dev/null 2>&1; then
            mkdir -p subscriber/.claude/nxd-practices/appendix/
            rsync -a --delete --exclude-from="$RUNNER_TEMP/rsync-excludes.txt" $GITHUB_WORKSPACE/dna-repo/nxd-practices/appendix/. subscriber/.claude/nxd-practices/appendix/
          fi

      - name: Copy PR template
        run: |
          mkdir -p subscriber/.github/
          cp $GITHUB_WORKSPACE/.github/PULL_REQUEST_TEMPLATE.md subscriber/.github/PULL_REQUEST_TEMPLATE.md

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git -C subscriber status --porcelain -- .claude/rules/ .claude/commands/ .claude/scripts/ .claude/dna/ .claude/nxd-practices/ .github/PULL_REQUEST_TEMPLATE.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.verbose }}" != "false" ]]; then
              echo "✅ \`${{ matrix.repo }}\` — already up to date." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if changed
        if: steps.changes.outputs.changed == 'true'
        id: open-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REPOS_PAT }}
          path: subscriber
          branch: automated/update-ai-coding-rules
          base: main
          delete-branch: true
          add-paths: |
            .claude/rules/
            .claude/commands/
            .claude/scripts/
            .claude/dna/
            .claude/nxd-practices/
            .github/PULL_REQUEST_TEMPLATE.md
          commit-message: "Update Claude config from NXD-Solutions/dna"
          title: "automated: Update Claude config from NXD-Solutions/dna"
          body: |
            Auto-generated by the **Distribute Claude Config** workflow in `NXD-Solutions/.github`.

            Syncs `.claude/rules/dna/`, `.claude/commands/dna/`, `.claude/scripts/`, and `.claude/dna/appendix/` (on-demand reference) from `NXD-Solutions/dna`, removes old distribution paths, and updates `.github/PULL_REQUEST_TEMPLATE.md`.

            Review the diff and merge.
          labels: chore

      - name: Report PR to summary
        if: steps.open-pr.outputs.pull-request-url != ''
        run: echo "${{ steps.open-pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
