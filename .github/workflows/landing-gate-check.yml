name: Landing Gate Check

# Runs a repository's own gate on a landing branch after a merge into it and sets one commit status, `landing-gate`, on that commit (NXD-Solutions/.github#418).
# The gate is the repository's: its command is the repository variable LANDING_GATE_COMMAND (a shell command run from the checked-out branch), and the Node version it
# needs is LANDING_GATE_NODE (default 24). A repository that sets no command gets a failure status that says so, never a pass.
# The cost of a run is the gate's duration, billed per job with a one-minute minimum (NXD-Solutions/dna `github-actions.md`); it waits on Deployment's and the principal's acceptance, and
# a repository pays only once it carries the caller.
on:
  workflow_call:
    inputs:
      # Where the status script is read from. The distributed caller never passes it, so every repo reads `main`; a test run on a scratch repository names a branch of this
      # repo, to run the job before it is merged.
      script_ref:
        type: string
        default: main

permissions:
  contents: read
  statuses: write

# gh sends no usage data (NXD-Solutions/dna:nxd-practices/appendix/technology-admission/gh/gh-2.99.md).
env:
  GH_TELEMETRY: "false"

# One run per branch, the latest merge's: a merge that lands while an earlier run is going cancels it, so the head's status is the head's own and a commit that is no
# longer the head gets none.
concurrency:
  group: landing-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Landing gate
    runs-on: ubuntu-latest
    # The gate is the repository's, so its length is too; the bound is the platform's ceiling for a hung run, not a budget.
    timeout-minutes: 60
    steps:
      - name: Checkout the branch at the commit that was pushed
        uses: actions/checkout@v5

      - name: Checkout .github (for the status script)
        uses: actions/checkout@v5
        with:
          repository: NXD-Solutions/.github
          ref: ${{ inputs.script_ref }}
          path: .github-landing-gate
          sparse-checkout: |
            scripts/landing-gate.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.LANDING_GATE_NODE || '24' }}

      - name: Run the repository's gate
        id: gate
        env:
          GATE_COMMAND: ${{ vars.LANDING_GATE_COMMAND }}
        # The step always succeeds: the gate's exit is an output, so the status step below reports it whatever it was. A missing command is its own output, never a pass.
        run: |
          set +e
          if [ -z "$GATE_COMMAND" ]; then
            echo "code=no-gate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash -o pipefail -c "$GATE_COMMAND" 2>&1 | tee "$RUNNER_TEMP/gate-output.txt"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Set the landing-gate status on this commit
        # Runs whatever the gate did, so a failing gate is a red status and never a missing one; the job itself goes red when the status is not a pass.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EXIT_CODE: ${{ steps.gate.outputs.code }}
          GATE_OUTPUT_FILE: ${{ runner.temp }}/gate-output.txt
        run: node .github-landing-gate/scripts/landing-gate.mjs
