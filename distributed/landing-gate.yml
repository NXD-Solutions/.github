name: Landing Gate

# Meant for every repo that has a landing branch (`landed/<name>`): copied byte for byte from `distributed/` in NXD-Solutions/.github. It is not a workflow of that repo.
# Never edit it in a subscriber: the next copy overwrites it. The checks themselves are in `landing-quick-check.yml` and `landing-gate-check.yml` in NXD-Solutions/.github.
#
# Two tests, two contexts, never mixed (NXD-Solutions/.github#423):
#   - after each merge into `landed/**` the QUICK set runs (the early warning) and sets `landing-quick`: the repository's variable LANDING_QUICK_COMMAND, optional; none set, nothing runs;
#   - the FULL test is started by hand with a landing branch and a commit of it, runs to its end whatever merges meanwhile, and sets `landing-gate` on that commit alone: the
#     repository's variable LANDING_GATE_COMMAND (and LANDING_GATE_NODE, if it needs another Node than 24; LANDING_GATE_TIMEOUT_MINUTES, its step limit, default 55).
# A candidate's pull request is admitted on `landing-gate` success at its head, so a quick pass never admits one.
on:
  push:
    branches:
      - 'landed/**'
  workflow_dispatch:
    inputs:
      branch:
        description: The landing branch the commit is on (landed/...)
        required: true
        type: string
      sha:
        description: The commit to test, in full; the branch's head or an ancestor of it
        required: true
        type: string

jobs:
  quick:
    if: ${{ github.event_name == 'push' }}
    # statuses: write is what sets the `landing-quick` status on the commit, and packages: read what lets the quick set install `@nxd-solutions` packages with the workflow's token;
    # nothing else is granted, and no grant is a write but the status.
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: NXD-Solutions/.github/.github/workflows/landing-quick-check.yml@main
    # `inherit` passes the repository's secrets; the workflow reads one only, NODE_AUTH_TOKEN, when the repo set it (a registry read token for packages the workflow's own
    # token cannot reach). A repo with none passes none.
    secrets: inherit

  full:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # The same grants as the quick set, for the same reasons: the one write is the `landing-gate` status.
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: NXD-Solutions/.github/.github/workflows/landing-gate-check.yml@main
    with:
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      step_minutes: ${{ vars.LANDING_GATE_TIMEOUT_MINUTES || '55' }}
    secrets: inherit
