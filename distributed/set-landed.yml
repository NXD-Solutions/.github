name: Set Landed

# Meant for every repo that has a landing branch (`landed/<name>`): copied byte for byte from `distributed/` in NXD-Solutions/.github. It is not a workflow of that repo.
# Never edit it in a subscriber: the next copy overwrites it. What it does is in `set-landed-check.yml` in NXD-Solutions/.github; the repository sets the tier projects as the
# variable LANDING_TIER_PROJECTS (a comma list of project numbers), and the token that writes them is the organisation secret the principal places.
on:
  pull_request:
    types: [closed]
    branches:
      - 'landed/**'

jobs:
  set-landed:
    # No grant: the workflow's own token is not used. The card is written with the organisation secret, which is the one write.
    permissions:
      contents: read
    uses: NXD-Solutions/.github/.github/workflows/set-landed-check.yml@main
    # `inherit` passes the repository's and organisation's secrets; the workflow reads PROJECTS_PAT, else ADD_TO_PROJECT_PAT, and no other.
    secrets: inherit
